<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>pmusic</title>
    <!-- 解析本地音频 ID3 信息兜底 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <!-- 移动端顺畅拖拽排序 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        /* ================= 基础变量与设计系统 ================= */
        :root {
            --bg-main: #F4F6F9;
            --bg-surface: #FFFFFF;
            --text-main: #1A1D20;
            --text-sub: #8B949E;
            --accent: #FF2D55;
            --shadow: 0 6px 20px rgba(0,0,0,0.06);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 24px;
            --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --apple-spring: cubic-bezier(0.25, 1, 0.5, 1);
            --apple-bounce: cubic-bezier(0.34, 1.35, 0.64, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100dvh;
            background-color: var(--bg-main); 
            font-family: var(--font-family); color: var(--text-main);
            position: fixed; inset: 0; overflow: hidden;
            -webkit-user-select: none; user-select: none; 
        }
        input { -webkit-user-select: auto; user-select: auto; }

        .device-mockup {
            position: absolute; inset: 0;
            overflow: hidden; display: flex; flex-direction: column;
        }
        ::-webkit-scrollbar { display: none; }

        /* ================= 苹果音乐级交互与自然弹性动效 ================= */
        .clickable { 
            transition: transform 0.16s var(--apple-spring), opacity 0.16s ease; 
            cursor: pointer; 
            will-change: transform;
        }
        .clickable:active { 
            transform: scale(0.95); 
            opacity: 0.85; 
        }

        .page {
            position: absolute; inset: 0;
            background-color: var(--bg-main); 
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none; z-index: 1;
            transition: opacity 0.28s var(--apple-spring), transform 0.28s var(--apple-spring); 
        }
        .page.active { opacity: 1; pointer-events: auto; z-index: 5; }

        .header-btn {
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface);
            box-shadow: var(--shadow); display: flex; justify-content: center; align-items: center;
            border: none; color: var(--text-main); flex-shrink: 0;
            transition: background-color 0.2s, transform 0.16s var(--apple-spring);
        }
        .header-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .header-btn.active-mode {
            background: var(--accent); color: #FFFFFF;
        }

        /* ================= 歌曲品质徽标 (Apple Music 风格) ================= */
        .quality-badge {
            display: inline-flex;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: 0.2px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.05);
            color: var(--text-sub);
            text-transform: uppercase;
            margin-left: 6px;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .quality-badge.lossless {
            background: rgba(255, 45, 85, 0.1);
            color: var(--accent);
            border: 0.5px solid rgba(255, 45, 85, 0.25);
        }
        .quality-badge.hires {
            background: linear-gradient(135deg, rgba(255, 45, 85, 0.15), rgba(255, 149, 0, 0.18));
            color: #E03E52;
            border: 0.5px solid rgba(255, 45, 85, 0.35);
        }
        .quality-badge.hq {
            background: rgba(0, 122, 255, 0.09);
            color: #007AFF;
        }

        /* iOS 风格悬浮药丸提示 */
        .ios-toast {
            position: fixed;
            top: calc(18px + env(safe-area-inset-top, 10px));
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(30, 30, 32, 0.88);
            color: #FFFFFF;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 300;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.38s var(--apple-bounce), opacity 0.25s ease;
            white-space: nowrap;
        }
        .ios-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ================= 1. 主页 (歌单页) ================= */
        .home-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: calc(15px + env(safe-area-inset-top, 0px)) 20px 10px 20px; 
            background-color: var(--bg-main); flex-shrink: 0; 
        }
        .home-header h1 { 
            font-size: 28px; font-weight: 800; color: var(--text-main); flex: 1; 
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 12px 0 0; 
        }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        
        .playlist-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; 
            padding: 5px 20px calc(110px + env(safe-area-inset-bottom)); 
            flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
            align-items: start; align-content: start; 
        }
        .playlist-card {
            background: var(--bg-surface); border-radius: var(--radius-md); padding: 10px;
            display: flex; flex-direction: column; box-shadow: var(--shadow); position: relative;
            touch-action: pan-y;
            transition: transform 0.2s var(--apple-spring), box-shadow 0.2s var(--apple-spring);
        }
        .cover-box {
            width: 100%; aspect-ratio: 1; flex-shrink: 0;
            border-radius: var(--radius-sm); margin-bottom: 10px;
            background-size: cover; background-position: center; box-shadow: 0 6px 16px rgba(0,0,0,0.08);
            display: flex; justify-content: center; align-items: center; position: relative; overflow: hidden;
            background-color: #E2E8F0;
        }
        .cover-box > svg { width: 40px; height: 40px; fill: white; }
        .card-play-btn {
            position: absolute; bottom: 8px; right: 8px; width: 32px; height: 32px;
            background: rgba(255,255,255,0.92); backdrop-filter: blur(10px);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); border: none; color: var(--text-main);
        }
        .card-play-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .playlist-card h3 { font-size: 14px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .playlist-card p { font-size: 11px; color: var(--text-sub); margin: 0; }

        @keyframes appleJiggle {
            0% { transform: rotate(-1.2deg) scale(0.98); }
            50% { transform: rotate(1.2deg) scale(0.99); }
            100% { transform: rotate(-1.2deg) scale(0.98); }
        }
        .playlist-grid.edit-mode .playlist-card { 
            animation: appleJiggle 0.28s infinite alternate ease-in-out;
            cursor: grab;
        }
        .card-delete-btn {
            position: absolute; top: -8px; left: -8px; width: 28px; height: 28px;
            background: #8E8E93; border-radius: 50%; display: none; 
            justify-content: center; align-items: center; border: 2px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25); z-index: 20; padding: 4px; pointer-events: auto;
        }
        .playlist-grid.edit-mode .card-delete-btn { display: flex; }
        .playlist-grid.edit-mode .card-play-btn { display: none; }

        /* ================= 2. 歌单内容页 ================= */
        .detail-header {
            height: 55%;
            display: flex; flex-direction: column; 
            background-color: var(--bg-main); 
            flex-shrink: 0; z-index: 10;
        }
        .detail-top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: calc(15px + env(safe-area-inset-top, 0px)) 20px 10px 20px;
            background: transparent; flex-shrink: 0;
        }
        .detail-top-title {
            flex: 1; text-align: center; font-size: 16px; font-weight: bold; color: var(--text-main);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 0 10px;
        }
        .detail-info { 
            display: flex; flex-direction: column; align-items: center; gap: 8px; 
            margin-top: 0px; margin-bottom: 12px; text-align: center; 
            flex: 1; min-height: 0; overflow: hidden;
        }
        .detail-cover {
            flex: 1; min-height: 0; aspect-ratio: 1; max-height: none; 
            border-radius: var(--radius-lg); box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            background-size: cover; background-position: center;
            background-color: var(--bg-surface);
            transition: transform 0.4s var(--apple-spring);
        }
        .detail-text { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .detail-text h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; color: var(--text-main); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;}
        .detail-text p { font-size: 13px; color: var(--text-sub); }
        
        .btn-action-group { display: flex; gap: 12px; width: 100%; padding: 0 24px 15px; border-bottom: 1px solid rgba(0,0,0,0.05); flex-shrink: 0;}
        .btn-action {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 30px; font-size: 15px; font-weight: bold; display: flex; align-items: center; gap: 6px;
            box-shadow: 0 8px 20px rgba(255, 45, 85, 0.25); flex: 1; justify-content: center;
        }
        .btn-action.secondary { background: rgba(0, 0, 0, 0.05); color: var(--accent); box-shadow: none; }

        .song-list { 
            height: 45%;
            padding: 10px 20px calc(120px + env(safe-area-inset-bottom)); 
            overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
        }
        .song-item {
            display: flex; align-items: center; padding: 10px 8px 10px 12px; border-radius: 12px; margin-bottom: 8px;
            background: var(--bg-surface); box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: background 0.2s var(--apple-spring), transform 0.16s var(--apple-spring);
        }
        .song-item.playing { background: rgba(255, 45, 85, 0.06); border: 1px solid rgba(255, 45, 85, 0.22); }
        .song-item.playing h4 { color: var(--accent); }
        .song-cover { width: 44px; height: 44px; border-radius: 8px; background-size: cover; background-position: center; background-color: #eee; margin-right: 12px; flex-shrink: 0; pointer-events: none;}
        .song-info { flex: 1; overflow: hidden; margin-right: 4px; pointer-events: none; }
        .song-info h4 { font-size: 15px; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-info p { 
            font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            display: flex; align-items: center;
        }
        
        .more-wrapper {
            width: 48px; height: 48px; display: flex; justify-content: center; align-items: center; 
            cursor: pointer; z-index: 10; pointer-events: auto;
        }
        .btn-icon { background: none; border: none; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; color: var(--text-sub); }
        .btn-icon svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
        
        .empty-state { text-align: center; color: var(--text-sub); padding: 40px 20px; font-size: 14px; }
        .sortable-ghost { opacity: 0.35; background: #F0F4F8; border: 2px dashed #CBD5E1; }
        .sortable-drag { cursor: grabbing !important; box-shadow: 0 15px 30px rgba(0,0,0,0.18) !important; transform: scale(1.03); z-index: 100;}

        /* ================= 3. 悬浮胶囊迷你播放器 ================= */
        .mini-player {
            position: fixed; 
            bottom: calc(20px + env(safe-area-inset-bottom, 10px)); 
            left: 5%; width: 90%; 
            height: 64px; 
            border-radius: var(--radius-md); padding: 0 16px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(0, 0, 0, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.09);
            z-index: 99; transform: translateY(250%); 
            transition: transform 0.42s var(--apple-bounce), opacity 0.25s ease;
            pointer-events: none;
            display: flex; align-items: center; justify-content: space-between;
            will-change: transform, opacity;
            touch-action: manipulation;
        }
        .mini-player.visible { transform: translateY(0); pointer-events: auto; }
        .mini-player.hidden-in-player { display: none !important; }
        
        .mini-cover { width: 44px; height: 44px; border-radius: var(--radius-sm); background-size: cover; background-position: center; background-color: #eee; margin-right: 12px; flex-shrink: 0;}
        .mini-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; margin-right: 8px; }
        .mini-info h4 { font-size: 15px; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .mini-info p { font-size: 12px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mini-controls { display: flex; gap: 8px; align-items: center; flex-shrink: 0;}
        .mini-btn { background: none; border: none; width: 38px; height: 38px; display: flex; justify-content: center; align-items: center; color: var(--text-main); flex-shrink: 0;}
        .mini-btn svg { width: 22px; height: 22px; fill: currentColor; }

        /* ================= 4. 全屏播放器 (Apple 级呼吸展开动效) ================= */
        #page-player { 
            z-index: 90; background-color: var(--bg-main); 
            transform: translateY(100%) scale(0.92);
            opacity: 0;
            transition: transform 0.42s var(--apple-spring), opacity 0.3s ease;
            will-change: transform, opacity;
        } 
        #page-player.active {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
        
        .player-header { display: flex; justify-content: space-between; align-items: center; padding: calc(15px + env(safe-area-inset-top, 0px)) 20px 10px 20px; position: relative; }
        .player-header span { color: var(--text-main); font-size: 16px; font-weight: 900; letter-spacing: 3px; }
        
        .player-content { flex: 1; display: flex; flex-direction: column; justify-content: flex-start; padding: 5px 32px calc(20px + env(safe-area-inset-bottom)); position: relative; }
        
        .main-cover-wrapper { flex: 1; display: flex; align-items: flex-start; justify-content: center; margin-top: 15px; margin-bottom: 25px; position: relative; }
        .main-cover { 
            width: 100%; aspect-ratio: 1; border-radius: var(--radius-lg); background-size: cover; 
            background-position: center; background-color: #eee; box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transition: transform 0.5s var(--apple-bounce), box-shadow 0.5s var(--apple-spring), opacity 0.3s;
            transform: scale(0.88);
        }
        /* Apple 音乐标志性呼吸反馈：播放时充盈展开，暂停时优雅微缩下沉 */
        .main-cover.is-playing {
            transform: scale(1);
            box-shadow: 0 26px 65px rgba(0,0,0,0.25);
        }
        .main-cover.hidden { opacity: 0; transform: scale(0.85); pointer-events: none; }
        
        .lyrics-view {
            position: absolute; inset: 0; background: transparent;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 24px 20px; transition: opacity 0.3s, transform 0.3s var(--apple-spring); opacity: 1; z-index: 10;
        }
        .lyrics-view.hidden { opacity: 0; transform: scale(1.05); pointer-events: none; }
        .lyrics-content {
            flex: 1; width: 100%; text-align: center; color: var(--text-main); font-size: 18px; line-height: 2.2;
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(to bottom, transparent, black 15%, black 85%, transparent);
            scroll-behavior: smooth; scrollbar-width: none; overflow-y: auto; overflow-x: hidden; padding: 0 10px;
            touch-action: pan-y;
            -webkit-overflow-scrolling: touch;
        }
        .lyrics-content::-webkit-scrollbar { display: none; }
        .lyrics-line { transition: color 0.3s, transform 0.3s var(--apple-spring), opacity 0.3s; padding: 6px 0; opacity: 0.4; cursor: pointer;}
        .lyrics-line.active { color: var(--accent); font-weight: bold; font-size: 24px; transform: scale(1.05); opacity: 1;}

        .player-info-row { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 25px; }
        .player-texts { flex: 1; overflow: hidden; margin-right: 12px; }
        .player-texts h2 { font-size: 24px; font-weight: 700; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main); }
        .player-sub-row { display: flex; align-items: center; }
        .player-texts p { font-size: 16px; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .progress-container { margin-bottom: 30px; position: relative; padding: 14px 0; cursor: pointer; touch-action: none; }
        .progress-bar-bg { width: 100%; height: 4px; background: rgba(0,0,0,0.1); border-radius: 2px; position: relative; pointer-events: none; }
        .progress-fill { width: 0%; height: 100%; background: var(--text-main); border-radius: 2px; position: relative; }
        .progress-fill::after { 
            content: ''; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; 
            background: var(--text-main); border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.25); 
            transition: transform 0.15s var(--apple-spring);
        }
        .progress-container:active .progress-fill::after,
        .progress-container.scrubbing .progress-fill::after { transform: scale(1.4); }
        .time-row { display: flex; justify-content: space-between; margin-top: 8px; font-size: 12px; color: var(--text-sub); pointer-events: none; }

        .main-controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .ctrl-btn { background: none; border: none; color: var(--text-main); }
        .ctrl-btn svg { width: 36px; height: 36px; fill: currentColor; }
        .play-pause-btn {
            width: 80px; height: 80px; border-radius: 50%; background: var(--text-main); color: white;
            display: flex; justify-content: center; align-items: center; box-shadow: 0 10px 20px rgba(0,0,0,0.12);
        }
        .play-pause-btn svg { width: 36px; height: 36px; fill: currentColor; }

        /* ================= 模态框 & 底部操作单 ================= */
        .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); z-index: 200; display: flex; justify-content: center; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity 0.25s var(--apple-spring); }
        .overlay.show { opacity: 1; pointer-events: auto; }
        
        .modal-box { background: var(--bg-surface); width: 80%; padding: 24px; border-radius: var(--radius-md); transform: translateY(20px); transition: transform 0.25s var(--apple-spring); box-shadow: 0 20px 40px rgba(0,0,0,0.1); margin-bottom: auto; margin-top: auto; }
        .overlay.show .modal-box { transform: translateY(0); }
        .modal-box h3 { margin-bottom: 16px; font-size: 18px; text-align: center; color: var(--text-main);}
        .modal-box input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #E2E8F0; background: #F8FAFC; color: var(--text-main); outline: none; margin-bottom: 20px; font-size: 16px; }
        .modal-btns { display: flex; gap: 12px; }
        .modal-btns button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-size: 15px; font-weight: bold; }
        .btn-cancel { background: #E2E8F0; color: var(--text-main); }
        .btn-confirm { background: var(--accent); color: white; }

        .action-sheet { background: var(--bg-surface); width: 100%; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; transform: translateY(100%); transition: transform 0.3s var(--apple-spring); }
        .overlay.show .action-sheet { transform: translateY(0); }
        .sheet-title { font-size: 14px; color: var(--text-sub); margin-bottom: 16px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sheet-btn { width: 100%; padding: 16px; background: none; border: none; font-size: 16px; color: var(--text-main); text-align: left; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f0f0f0; }
        .sheet-btn:last-child { border-bottom: none; }
        .sheet-btn.danger { color: var(--accent); }
        .sheet-btn svg { width: 20px; height: 20px; fill: currentColor; }
        
        #confirm-modal-overlay { z-index: 210; }
        #startup-loader { position: fixed; inset: 0; background: var(--bg-main); z-index: 999; display: flex; justify-content: center; align-items: center; transition: opacity 0.25s ease; }
    </style>
</head>
<body>
<div id="startup-loader">
    <p style="color: var(--text-sub); font-size: 15px;">加载音乐库中...</p>
</div>

<!-- iOS 灵动药丸浮窗反馈 -->
<div id="ios-toast" class="ios-toast">已切换播放模式</div>

<div class="device-mockup">
    <!-- 顶层标准 Audio 元素 -->
    <audio id="real-audio-player" preload="auto" playsinline webkit-playsinline></audio>
    <input type="file" id="file-input" accept="audio/*, .mp3, .wav, .flac, .m4a, .aac, .ogg, .wma, .amr" multiple style="display: none;">
    <input type="file" id="cover-input" accept="image/*" style="display: none;">
    <input type="file" id="lrc-input" accept=".lrc" style="display: none;">

    <!-- 1. 主页 -->
    <div id="page-home" class="page active">
        <div class="home-header">
            <h1>音乐库</h1>
            <div class="header-actions">
                <button class="header-btn clickable" id="btn-toggle-sort" onclick="toggleEditMode()" title="调整位置">
                    <svg viewBox="0 0 24 24"><path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/></svg>
                </button>

<script>
    const DB_NAME = 'LocalMusicDB';
    const DB_VERSION = 1;
    let db = null;

    function initDB() {
        return new Promise((resolve) => {
            try {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onerror = () => resolve(false);
                req.onsuccess = e => { db = e.target.result; resolve(true); };
                req.onupgradeneeded = e => {
                    const database = e.target.result;
                    if(!database.objectStoreNames.contains('songs')) database.createObjectStore('songs', { keyPath: 'id' });
                    if(!database.objectStoreNames.contains('playlists')) database.createObjectStore('playlists', { keyPath: 'id' });
                };
            } catch(err) {
                resolve(false);
            }
        });
    }

    function saveSongToDB(song) {
        return new Promise((resolve) => {
            if(!db) return resolve();
            try {
                const tx = db.transaction('songs', 'readwrite');
                const dbSong = { 
                    id: song.id, title: song.title, artist: song.artist, 
                    audioFile: song.audioFile, coverBlob: song.coverBlob, 
                    fallbackCover: song.fallbackCover, lyrics: song.lyrics,
                    duration: song.duration || 0
                };
                tx.objectStore('songs').put(dbSong);
                tx.oncomplete = resolve;
                tx.onerror = resolve;
            } catch(e) { resolve(); }
        });
    }

    function deleteSongFromDB(id) {
        if(!db) return;
        try {
            const tx = db.transaction('songs', 'readwrite');
            tx.objectStore('songs').delete(id);
        } catch(e) {}
    }

    function savePlaylistsToDB() {
        if(!db) return;
        try {
            const tx = db.transaction('playlists', 'readwrite');
            const store = tx.objectStore('playlists');
            store.clear();
            playlists.forEach(p => store.put({ id: p.id, title: p.title, cover: p.cover, songs: p.songs }));
        } catch(e) {}
    }

    function loadDataFromDB() {
        return new Promise((resolve) => {
            if(!db) return resolve({ songs: [], playlists: [] });
            try {
                const tx = db.transaction(['songs', 'playlists'], 'readonly');
                const songReq = tx.objectStore('songs').getAll();
                const plReq = tx.objectStore('playlists').getAll();

                let done = 0;
                let songs = [];
                let pls = [];

                const finish = () => {
                    done++;
                    if (done === 2) resolve({ songs, playlists: pls });
                };

                songReq.onsuccess = () => { songs = songReq.result || []; finish(); };
                songReq.onerror = () => finish();
                plReq.onsuccess = () => { pls = plReq.result || []; finish(); };
                plReq.onerror = () => finish();
                tx.onerror = () => resolve({ songs: [], playlists: [] });
            } catch(e) {
                resolve({ songs: [], playlists: [] });
            }
        });
    }

    const allSongs = new Map();

        if (!toastEl) return;
        toastEl.innerText = msg;

        toastTimer = setTimeout(() => {

    // 计算歌曲音质等级 (Apple Music 风格)
    function getAudioQuality(song) {
        if (!song || !song.audioFile) return { label: '标准音质', type: 'standard' };
        const name = (song.audioFile.name || '').toLowerCase();
        const ext = name.split('.').pop();
        
        // 无损格式检测
        if (['flac', 'wav', 'alac', 'ape', 'aiff'].includes(ext)) {
            if (song.audioFile.size > 28 * 1024 * 1024) {
                return { label: 'Hi-Res 无损', type: 'hires' };
            }
            return { label: '无损', type: 'lossless' };
        }
        
        // 估算码率
        if (song.duration && song.duration > 0) {
            const kbps = Math.round((song.audioFile.size * 8) / song.duration / 1000);
            if (kbps >= 290) return { label: 'HQ 320K', type: 'hq' };
            if (kbps >= 210) return { label: '极高 256K', type: 'hq' };
            if (kbps >= 150) return { label: '高品质 AAC', type: 'hq' };
            return { label: '标准音质', type: 'standard' };
        }

        if (['m4a', 'aac'].includes(ext)) return { label: 'AAC 高品质', type: 'hq' };
        if (song.audioFile.size > 9 * 1024 * 1024) return { label: '高品质 HQ', type: 'hq' };
        return { label: '标准音质', type: 'standard' };
    }

    // 强力零依赖：多格式内嵌封面二进制深度解包器 (MP3 ID3v2 / M4A / FLAC)
    async function extractCoverNative(file) {
        try {
            const sliceSize = Math.min(file.size, 6 * 1024 * 1024);
            const buffer = await file.slice(0, sliceSize).arrayBuffer();
            const bytes = new Uint8Array(buffer);

            // 1. M4A / MP4 容器格式扫描 (covr atom)
            for (let i = 0; i < bytes.length - 16; i++) {
                if (bytes[i] === 0x63 && bytes[i+1] === 0x6F && bytes[i+2] === 0x76 && bytes[i+3] === 0x72) {
                    for (let j = i + 4; j < Math.min(i + 400, bytes.length - 4); j++) {
                        if (bytes[j] === 0xFF && bytes[j+1] === 0xD8 && bytes[j+2] === 0xFF) {
                            return sliceExactImage(bytes, j, 'image/jpeg');
                        }
                        if (bytes[j] === 0x89 && bytes[j+1] === 0x50 && bytes[j+2] === 0x4E && bytes[j+3] === 0x47) {
                            return sliceExactImage(bytes, j, 'image/png');
                        }
                    }
                }
            }

            // 2. MP3 ID3v2 标签精准解析 (APIC 帧)
            if (bytes[0] === 0x49 && bytes[1] === 0x44 && bytes[2] === 0x33) {
                for (let i = 10; i < bytes.length - 16; i++) {
                    if (bytes[i] === 0x41 && bytes[i+1] === 0x50 && bytes[i+2] === 0x49 && bytes[i+3] === 0x43) {
                        for (let j = i + 4; j < Math.min(i + 350, bytes.length - 4); j++) {
                            if (bytes[j] === 0xFF && bytes[j+1] === 0xD8 && bytes[j+2] === 0xFF) {
                                return sliceExactImage(bytes, j, 'image/jpeg');
                            }
                            if (bytes[j] === 0x89 && bytes[j+1] === 0x50 && bytes[j+2] === 0x4E && bytes[j+3] === 0x47) {
                                return sliceExactImage(bytes, j, 'image/png');
                            }
                        }
                    }
                }
            }

            // 3. FLAC 原生 PICTURE 元数据块识别
            if (bytes[0] === 0x66 && bytes[1] === 0x4C && bytes[2] === 0x61 && bytes[3] === 0x43) {
                for (let i = 4; i < Math.min(bytes.length - 16, 2 * 1024 * 1024); i++) {
                    if (bytes[i] === 0xFF && bytes[i+1] === 0xD8 && bytes[i+2] === 0xFF) {
                        return sliceExactImage(bytes, i, 'image/jpeg');
                    }
                    if (bytes[i] === 0x89 && bytes[i+1] === 0x50 && bytes[i+2] === 0x4E && bytes[i+3] === 0x47) {
                        return sliceExactImage(bytes, i, 'image/png');
                    }
                }
            }

            // 4. 全流特征魔数强力嗅探
            for (let i = 0; i < bytes.length - 4; i++) {
                if (bytes[i] === 0xFF && bytes[i+1] === 0xD8 && bytes[i+2] === 0xFF && (bytes[i+3] === 0xE0 || bytes[i+3] === 0xE1 || bytes[i+3] === 0xDB || bytes[i+3] === 0xEE)) {
                    return sliceExactImage(bytes, i, 'image/jpeg');
                }
                if (bytes[i] === 0x89 && bytes[i+1] === 0x50 && bytes[i+2] === 0x4E && bytes[i+3] === 0x47) {
                    return sliceExactImage(bytes, i, 'image/png');
                }
            }
        } catch(err) {
            console.warn("原生提取封面异常", err);
        }
        return null;
    }

    function sliceExactImage(bytes, startIndex, mimeType) {
        if (mimeType === 'image/jpeg') {
            for (let k = startIndex + 10; k < bytes.length - 1; k++) {
                if (bytes[k] === 0xFF && bytes[k+1] === 0xD9) {
                    return new Blob([bytes.subarray(startIndex, k + 2)], { type: 'image/jpeg' });
                }
            }
        } else if (mimeType === 'image/png') {
            for (let k = startIndex + 10; k < bytes.length - 7; k++) {
                if (bytes[k] === 0x49 && bytes[k+1] === 0x45 && bytes[k+2] === 0x4E && bytes[k+3] === 0x44) {
                    return new Blob([bytes.subarray(startIndex, k + 8)], { type: 'image/png' });
                }
            }
        }
        const safeEnd = Math.min(bytes.length, startIndex + 1.8 * 1024 * 1024);
        return new Blob([bytes.subarray(startIndex, safeEnd)], { type: mimeType });
    }

    // 专属抽象黑胶光盘封面生成（针对无内嵌封面的自适应艺术化配图）
    function generateCoverFromTitle(title, artist) {
        return new Promise((resolve) => {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 400;
                const ctx = canvas.getContext('2d');

                let hash = 0;
                const str = (title || 'pmusic') + (artist || '');
                for (let i = 0; i < str.length; i++) {
                    hash = str.charCodeAt(i) + ((hash << 5) - hash);
                }
                const h1 = Math.abs(hash % 360);
                const h2 = (h1 + 55) % 360;

                const grad = ctx.createLinearGradient(0, 0, 400, 400);
                grad.addColorStop(0, `hsl(${h1}, 75%, 65%)`);
                grad.addColorStop(1, `hsl(${h2}, 85%, 45%)`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 400, 400);

                ctx.strokeStyle = "rgba(255, 255, 255, 0.16)";
                for (let r = 40; r < 190; r += 24) {
                    ctx.beginPath();
                    ctx.arc(200, 200, r, 0, Math.PI * 2);
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                }

                ctx.fillStyle = "rgba(0, 0, 0, 0.22)";
                ctx.beginPath();
                ctx.arc(200, 200, 32, 0, Math.PI * 2);
                ctx.fill();

                const char = (title || '音').trim().charAt(0).toUpperCase();
                ctx.fillStyle = "#FFFFFF";
                ctx.font = "bold 80px -apple-system, sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(char, 200, 200);

                canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.88);
            } catch(e) {
                resolve(null);
            }
        });
    }

    const generateGradient = () => {
        const colors = ['#a1c4fd', '#c2e9fb', '#f093fb', '#f5576c', '#84fab0', '#8fd3f4', '#ffecd2', '#fcb69f'];
        return `linear-gradient(135deg, ${colors[Math.floor(Math.random() * colors.length)]} 0%, ${colors[Math.floor(Math.random() * colors.length)]} 100%)`;

        if (url) return `url('${url}')`;

    async function startApp() {
        setTimeout(hideLoader, 400);

        dom.pages.home.addEventListener('click', (e) => {
            if(isEditMode && !justEnteredEditMode && !e.target.closest('.card-delete-btn') && !e.target.closest('.playlist-card') && !e.target.closest('#btn-toggle-sort')) {
                exitEditMode();
            }
        });

        try {
            await initDB();
            const data = await loadDataFromDB();
            
            if(data.playlists && data.playlists.length > 0) {
                playlists = data.playlists.filter(p => !p.isSystem && p.id !== 'sys_liked'); 
            } else { playlists = []; }

            data.songs.forEach(dbSong => {
                if (dbSong.audioFile) dbSong.url = URL.createObjectURL(dbSong.audioFile);
                dbSong.coverUrl = dbSong.coverBlob ? URL.createObjectURL(dbSong.coverBlob) : null;
                allSongs.set(dbSong.id, dbSong);
            });
        } catch (e) {

        renderHomePlaylists();

    function hideLoader() {

    function safeTransition(targetPageId, callback) {

    async function processFile(file, playlist) {
        const songId = 'song_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
        let baseName = file.name.replace(/\.[^/.]+$/, "").trim();
        let assumedTitle = baseName; 
        let assumedArtist = '未知歌手';

        if(baseName.includes('-')) { 
            const parts = baseName.split('-'); 
            if(parts.length >= 2) { 
                assumedArtist = parts[0].trim(); 
                assumedTitle = parts.slice(1).join('-').trim(); 
            } 
        }

        // 1. 原生深度解包提取封面
        let coverBlob = await extractCoverNative(file);

        // 2. jsmediatags 标签辅助解析
        if (window.jsmediatags) {
            await new Promise((res) => {
                const timeout = setTimeout(res, 500);
                try {
                    window.jsmediatags.read(file, {
                        onSuccess: (tag) => {
                            clearTimeout(timeout);
                            if (tag.tags.title && tag.tags.title.trim()) assumedTitle = tag.tags.title.trim();
                            if (tag.tags.artist && tag.tags.artist.trim()) assumedArtist = tag.tags.artist.trim();
                            if (!coverBlob && tag.tags.picture) {
                                try {
                                    coverBlob = new Blob([new Uint8Array(tag.tags.picture.data)], { type: tag.tags.picture.format || 'image/jpeg' });
                                } catch (e) {}
                            }
                            res();
                        },
                        onError: () => { clearTimeout(timeout); res(); }
                    });
                } catch(e) { clearTimeout(timeout); res(); }
            });
        }

        // 3. 确实无内嵌封面时，自动生成黑胶抽象艺术图
        if (!coverBlob) {
            coverBlob = await generateCoverFromTitle(assumedTitle, assumedArtist);
        }

        const songData = { 
            id: songId, 
            title: assumedTitle, 
            artist: assumedArtist, 
            audioFile: file, 
            coverBlob: coverBlob, 
            fallbackCover: generateGradient(), 
            lyrics: null,
            duration: 0
        };

        songData.url = URL.createObjectURL(songData.audioFile);
        if (songData.coverBlob) songData.coverUrl = URL.createObjectURL(songData.coverBlob);

        allSongs.set(songId, songData); 
        playlist.songs.push(songId); 
        renderSongList();
        await saveSongToDB(songData);
    }

    const modeIcons = [

    function getNextSongId(isForward = true) {

    function syncPlayIcon(isPlaying) {

    function parseLRC(lrcText) {
        const lines = lrcText.split('\n'); const result = []; const timeReg = /\[(\d{2,}):(\d{2})(?:\.(\d{1,3}))?\]/;
        for (let line of lines) {
            const match = timeReg.exec(line);
            if (match) {
                const min = parseInt(match[1]); const sec = parseInt(match[2]); const msStr = match[3] || '0'; let ms = parseInt(msStr);
                if (msStr.length === 1) ms *= 100; else if (msStr.length === 2) ms *= 10;
                const time = min * 60 + sec + ms / 1000; const text = line.replace(timeReg, '').trim();
                if(text) result.push({ time, text });
            }
        }
        return result.sort((a, b) => a.time - b.time);
    }

    function renderLyricsDisplay() {
        const song = allSongs.get(currentSongId); 
        const contentDiv = document.getElementById('lyrics-content'); 
        const actionsDiv = document.getElementById('lyrics-actions');
        parsedLyrics = []; lyricElements = []; currentActiveLyricIndex = -1;

        if(!song || !song.lyrics) { 
            contentDiv.innerHTML = '<p style="padding-top:40%; color:var(--text-sub);">暂无歌词信息</p>'; 
            actionsDiv.style.display = 'flex'; 
            return; 
        }

        actionsDiv.style.display = 'none'; 
        parsedLyrics = parseLRC(song.lyrics);

        if(parsedLyrics.length > 0) {
            contentDiv.innerHTML = parsedLyrics.map((l, i) => `<div class="lyrics-line clickable" id="lrc-line-${i}" onclick="seekToLyricLine(${l.time})">${l.text}</div>`).join('') + '<div style="height: 45vh;"></div>';
            lyricElements = parsedLyrics.map((_, i) => document.getElementById(`lrc-line-${i}`));
        } else { 
            contentDiv.innerHTML = song.lyrics.split('\n').map(l => `<div class="lyrics-line">${l}</div>`).join(''); 
        }
    }

    // 点击歌词行直接跳播
    function seekToLyricLine(time) {
        if (!dom.audioPlayer.duration) return;
        dom.audioPlayer.currentTime = time;
        isUserScrollingLyrics = false;
    }

    // 用户滚动歌词时暂停自动滚动 3.5 秒
    function initLyricScrollInteractivity() {
        const setScrolling = () => {
            isUserScrollingLyrics = true;
            if (lyricUserScrollTimer) clearTimeout(lyricUserScrollTimer);
            lyricUserScrollTimer = setTimeout(() => {
                isUserScrollingLyrics = false;
            }, 3500);
        };
        dom.lyricsContent.addEventListener('touchstart', setScrolling, {passive: true});
        dom.lyricsContent.addEventListener('wheel', setScrolling, {passive: true});
    }

    dom.lrcInput.addEventListener('change', function(e) {
        const file = e.target.files[0]; if(!file || !currentSongId) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const song = allSongs.get(currentSongId); song.lyrics = e.target.result; saveSongToDB(song);
            if(isLyricsVisible) renderLyricsDisplay();
            showToast('已加载本地歌词');
        };
        reader.readAsText(file); dom.lrcInput.value = '';
    });

    async function searchLyricsAPI() {
        if(!currentSongId) return; const song = allSongs.get(currentSongId); const contentDiv = document.getElementById('lyrics-content');
        contentDiv.innerHTML = '<p style="padding-top:40%;">网络搜索中...</p>';
        try {
            const cleanTitle = song.title.replace(/[\(\[].*?[\)\]]/g, '').replace(/-.*/g, '').trim();
            const cleanArtist = song.artist !== '未知歌手' ? song.artist.replace(/[\(\[].*?[\)\]]/g, '').trim() : '';
            let foundLyrics = null;
            const fetchLrcLib = async (query) => {
                if(!query) return null;
                try {
                    const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(query)}`);
                    if(res.ok) { const data = await res.json(); if(data && data.length > 0) { const bestMatch = data.find(item => item.syncedLyrics) || data[0]; return bestMatch.syncedLyrics || bestMatch.plainLyrics; } }
                } catch(e) {} return null;
            };

            if(cleanArtist) { foundLyrics = await fetchLrcLib(`${cleanTitle} ${cleanArtist}`); }
            if(!foundLyrics) { foundLyrics = await fetchLrcLib(cleanTitle); }
            if (!foundLyrics && cleanArtist) {
                try {
                    const ovhRes = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(cleanArtist)}/${encodeURIComponent(cleanTitle)}`);
                    if(ovhRes.ok) { const data = await ovhRes.json(); if(data.lyrics) foundLyrics = data.lyrics; }
                } catch(e) {}
            }

            if (foundLyrics) { 
                song.lyrics = foundLyrics; 
                saveSongToDB(song); 
                renderLyricsDisplay(); 
                showToast('已匹配到歌词');
                return; 
            }
            throw new Error('Not found');
        } catch(e) { 
            contentDiv.innerHTML = '<p style="padding-top:30%; color:var(--text-sub);">线上未能找到对应歌词<br><br>建议点击下方"本地导入"选择 .lrc 文件</p>'; 
        }
    }

    function formatTime(s) { if (isNaN(s)) return "0:00"; const m = Math.floor(s/60); const sec = Math.floor(s%60); return `${m}:${sec<10?'0'+sec:sec}`; }
    
    dom.audioPlayer.addEventListener('timeupdate', () => {
        const currentTime = dom.audioPlayer.currentTime; 
        if (!isScrubbing) {
            dom.timeCurrent.innerText = formatTime(currentTime);
            if (dom.audioPlayer.duration) dom.progressFill.style.width = `${(currentTime/dom.audioPlayer.duration)*100}%`;
        }
        
        // 丝滑歌词滚动计算
        if (isLyricsVisible && parsedLyrics.length > 0 && lyricElements.length > 0) {
            let activeIndex = -1;
            for(let i=0; i<parsedLyrics.length; i++) { 
                if(currentTime >= parsedLyrics[i].time) activeIndex = i; else break; 
            }
            if(activeIndex !== -1 && activeIndex !== currentActiveLyricIndex) {
                if (currentActiveLyricIndex !== -1 && lyricElements[currentActiveLyricIndex]) {
                    lyricElements[currentActiveLyricIndex].classList.remove('active');
                }
                currentActiveLyricIndex = activeIndex;
                const activeLine = lyricElements[currentActiveLyricIndex];
                if(activeLine) {
                    activeLine.classList.add('active'); 
                    if (!isUserScrollingLyrics) {
                        dom.lyricsContent.scrollTo({ 
                            top: activeLine.offsetTop - dom.lyricsContent.clientHeight / 2 + 20, 
                            behavior: 'smooth' 
                        });
                    }
                }
            }
        }
    });
    
    dom.audioPlayer.addEventListener('loadedmetadata', () => { 
        dom.timeTotal.innerText = formatTime(dom.audioPlayer.duration);
        if (currentSongId) {
            const s = allSongs.get(currentSongId);
            if (s && (!s.duration || s.duration === 0)) {
                s.duration = dom.audioPlayer.duration;
                saveSongToDB(s);
                updatePlayerUI();
                renderSongList();
            }
        }
    });

    // 顺滑手势拖拽进度条 (Scrubbing)
    function initProgressBarScrubbing() {
        const container = dom.progressContainer;
        let scrubRatio = 0;

        const updateScrub = (clientX) => {
            if (!dom.audioPlayer.duration) return;
            const rect = container.getBoundingClientRect();
            let ratio = (clientX - rect.left) / rect.width;
            ratio = Math.max(0, Math.min(1, ratio));
            scrubRatio = ratio;
            dom.progressFill.style.width = `${ratio * 100}%`;
            dom.timeCurrent.innerText = formatTime(ratio * dom.audioPlayer.duration);
        };

        const onTouchStart = (e) => {
            if (!dom.audioPlayer.duration) return;
            isScrubbing = true;
            container.classList.add('scrubbing');
            updateScrub(e.touches[0].clientX);
        };
        const onTouchMove = (e) => {
            if (!isScrubbing) return;
            updateScrub(e.touches[0].clientX);
        };
        const onTouchEnd = () => {
            if (!isScrubbing) return;
            isScrubbing = false;
            container.classList.remove('scrubbing');
            if (dom.audioPlayer.duration) {
                dom.audioPlayer.currentTime = scrubRatio * dom.audioPlayer.duration;
            }
        };

        container.addEventListener('touchstart', onTouchStart, {passive: true});
        window.addEventListener('touchmove', onTouchMove, {passive: true});
        window.addEventListener('touchend', onTouchEnd);

        container.addEventListener('mousedown', (e) => {
            if (!dom.audioPlayer.duration) return;
            isScrubbing = true;
            container.classList.add('scrubbing');
            updateScrub(e.clientX);

            const onMouseMove = (me) => { if(isScrubbing) updateScrub(me.clientX); };
            const onMouseUp = () => {
                if(isScrubbing) {
                    isScrubbing = false;
                    container.classList.remove('scrubbing');
                    if (dom.audioPlayer.duration) {
                        dom.audioPlayer.currentTime = scrubRatio * dom.audioPlayer.duration;
                    }
                }
                window.removeEventListener('mousemove', onMouseMove);
                window.removeEventListener('mouseup', onMouseUp);
            };
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
        });
    }

    function updatePlayerUI() {
        if (!currentSongId) return; const song = allSongs.get(currentSongId); if(!song) return;
        const coverSrc = formatCoverCSS(song.coverUrl, song.fallbackCover);
        document.getElementById('mini-cover').style.backgroundImage = coverSrc; 
        document.getElementById('mini-title').innerText = song.title; 
        document.getElementById('mini-artist').innerText = song.artist;
        document.getElementById('player-cover').style.backgroundImage = coverSrc; 
        document.getElementById('player-title').innerText = song.title; 
        document.getElementById('player-artist').innerText = song.artist;

        // 更新全屏播放器音质胶囊徽章
        const quality = getAudioQuality(song);
        const badgeEl = document.getElementById('player-quality-badge');
        if (badgeEl) {
            badgeEl.innerHTML = `<span class="quality-badge ${quality.type}">${quality.label}</span>`;
        }

        if ('mediaSession' in navigator) {
            const artwork = song.coverUrl ? [{ src: song.coverUrl, sizes: '512x512', type: 'image/jpeg' }] : [];
            navigator.mediaSession.metadata = new MediaMetadata({
                title: song.title, artist: song.artist, album: currentPlaylist ? currentPlaylist.title : 'pmusic',
                artwork: artwork
            });
            navigator.mediaSession.setActionHandler('play', () => togglePlay()); 
            navigator.mediaSession.setActionHandler('pause', () => togglePlay());
            navigator.mediaSession.setActionHandler('previoustrack', () => playPrev()); 
            navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
        }
    }

    function openPlayer(e) { if (e && e.target.closest('.mini-controls')) return; if (currentSongId) safeTransition('player'); }
    function closePlayer() { safeTransition(currentPlaylist ? 'detail' : 'home'); }
    function navigate(pageId) { safeTransition(pageId); }

    // 手势侧滑与平滑返回
    let touchstartX = 0; let touchstartY = 0;
    document.addEventListener('touchstart', e => { 
        touchstartX = e.changedTouches[0].screenX; 
        touchstartY = e.changedTouches[0].screenY; 
    }, {passive: true});

    document.addEventListener('touchend', e => {
        const touchendX = e.changedTouches[0].screenX; const touchendY = e.changedTouches[0].screenY;
        const xDiff = touchendX - touchstartX; const yDiff = touchendY - touchstartY;
        if(e.target.closest('.progress-container') || e.target.closest('.sortable-drag') || e.target.closest('.lyrics-content')) return;
        if (dom.pages.player.classList.contains('active')) { 
            if ((Math.abs(xDiff) > 80 && Math.abs(yDiff) < 60) || (yDiff > 100 && Math.abs(xDiff) < 60)) { 
                closePlayer(); 
            } 
        } else if (dom.pages.detail.classList.contains('active')) { 
            if (xDiff > 80 && touchstartX < 50 && Math.abs(yDiff) < 60) { 
                navigate('home'); 
            } 
        }
    });

    // 启动应用
    startApp();
</script>
</body>
</html>
